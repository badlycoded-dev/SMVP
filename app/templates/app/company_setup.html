{% extends 'app/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-container">
    <h1>{{ title }}</h1>
    <p>Вашу заявку схвалено! Заповніть дані компанії, щоб почати продавати.</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-auth">Створити компанію</button>
    </form>
</div>
{% endblock %}
