{% extends 'app/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-container">
    <h1>{{ title }}</h1>
    <p>Подайте заявку, щоб отримати можливість продавати товари на платформі.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-auth">Надіслати заявку</button>
    </form>
</div>
{% endblock %}
