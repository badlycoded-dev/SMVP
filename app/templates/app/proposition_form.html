{% extends 'app/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-container">
    <h1>{{ title }} — {{ company.name }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-auth">Надіслати</button>
    </form>
</div>
{% endblock %}
